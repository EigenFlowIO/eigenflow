[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigenflow"
version = "1.0.0a1"
description = "Post hoc neural-network interpretability through multiscale relational analysis of probe populations."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Andrew Hedman"}]
keywords = ["neural-network-interpretability", "representation-analysis", "spectral-graph-theory", "percolation", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
vision = ["torchvision>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Repository = "https://github.com/eigenflowio/eigenflow"
Documentation = "https://github.com/eigenflowio/eigenflow/tree/main/docs"
Changelog = "https://github.com/eigenflowio/eigenflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/eigenflowio/eigenflow/issues"
